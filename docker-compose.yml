services:
  blurrise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blurrise-web
    ports:
      - "8742:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
